model:
  image_size: 384
  in_channels: 1
  encoder_backend: conv
  encoder_name: microsoft/rad-dino
  encoder_revision: null
  hidden_dim: 768
  anatomy_slots: 24
  graph_layers: 2
  graph_heads: 8
  decoder_layers: 6
  decoder_heads: 12
  ff_dim: 3072
  dropout: 0.15
  max_report_tokens: 256
  vocab_size: 12000
  num_findings: 14
  num_semantic_states: 4
training:
  batch_size: 16
  epochs: 120
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  num_workers: 4
  warmup_epochs: 5
  label_smoothing: 0.1
  early_stopping_patience: 15
  seeds: [42, 123, 2024, 3407, 9999]
controller:
  tau_e: 0.62
  tau_con: 0.55
  tau_suppress: 0.35
  beam_size: 3
  max_sentences: 12
  max_sentence_tokens: 48
loss:
  gen: 1.0
  clin: 0.35
  grd: 0.25
  con: 0.15
  hall: 0.30
  cal: 0.05
  grounding_contrastive_temperature: 0.07
  grounding_assignment_weight: 1.0
  grounding_contrastive_weight: 1.0
data:
  manifest: data/manifest.csv
  image_size: 384
  max_report_tokens: 256
  percentile_low: 0.5
  percentile_high: 99.5
  rotation_deg: 5.0
  translate_frac: 0.03
  contrast_jitter: 0.10
  no_horizontal_flip: true
eval:
  n_bootstrap: 5000
  bootstrap_seed: 2026
  critical_findings: []
  primary_metrics: [ufr, supported_recall, c_f1, grounding_f1]
regions_path: configs/regions.yaml
findings_path: configs/findings.yaml
graph_path: configs/graph.yaml
